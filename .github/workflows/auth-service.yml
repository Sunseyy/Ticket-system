name: CI/CD - auth-service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'auth-service/**'        # Se déclenche SEULEMENT si auth-service change
  pull_request:
    branches: [ "main" ]
    paths:
      - 'auth-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clone le repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Docker Buildx (cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login GHCR (pas Docker Hub)
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 4️⃣ Tags automatiques (latest + sha)
      - name: Extract metadata for auth-service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sunseyy/auth-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # 5️⃣ Build & Push vers ghcr.io
      - name: Build and Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
