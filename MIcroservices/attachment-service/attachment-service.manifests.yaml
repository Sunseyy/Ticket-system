# ─────────────────────────────────────────────
# SECRET
# ─────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: attachment-db-secret
type: Opaque
stringData:
  username: postgres
  password: postgres

---
# ─────────────────────────────────────────────
# PVC: uploads
# ─────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ─────────────────────────────────────────────
# ATTACHMENT SERVICE DEPLOYMENT
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attachment-service
  labels:
    app: attachment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attachment-service
  template:
    metadata:
      labels:
        app: attachment-service
    spec:
      # 🔐 Pull from GHCR
      imagePullSecrets:
        - name: ghcr-secret

      # 🔐 Pod-level security
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1001

      containers:
        - name: attachment-service
          image: ghcr.io/sunseyy/attachment-service:latest
          ports:
            - containerPort: 3004

          # 🔐 Container-level security
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: PORT
              value: "3004"
            - name: DB_HOST
              value: "attachment-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "attachment_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: attachment-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attachment-db-secret
                  key: password
            - name: UPLOAD_DIR
              value: "/uploads"

          volumeMounts:
            - name: uploads-storage
              mountPath: /uploads
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: attachment-uploads-pvc
        - name: tmp
          emptyDir: {}

---
# ─────────────────────────────────────────────
# ATTACHMENT SERVICE
# ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: attachment-service
spec:
  selector:
    app: attachment-service
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004

---
# ─────────────────────────────────────────────
# ROUTE
# ─────────────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: attachment-service
spec:
  to:
    kind: Service
    name: attachment-service
  port:
    targetPort: 3004
  tls:
    termination: edge
